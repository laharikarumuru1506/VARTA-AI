server.port : 8080
spring.application.name: varta-ai

spring.datasource.url : jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&allowPublicKeyRetrieval=true
spring.datasource.username : ${DB_USER}
spring.datasource.password : ${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto : validate
spring.jpa.show-sql : true